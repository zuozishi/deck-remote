name: Build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }

      - name: Build
        run: dotnet build DeckRemote.slnx --configuration Release

      - name: Run automated checks
        run: dotnet run --project tests/DeckRemote.Checks --configuration Release --no-build

      - name: Build installation packages
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $makeNsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          ./packaging/Build.ps1 -MakeNsis $makeNsis

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $packageNames = @("DeckRemote-$version-win-x64-setup.exe", "DeckRemote-$version-steamos-x64.tar.gz")
          $checksums = foreach ($name in $packageNames) {
              $hash = (Get-FileHash -LiteralPath (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $name"
          }
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii -NoNewline -Value (($checksums -join "`n") + "`n")

      - name: Upload installation packages
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deck-remote-installers
          path: |
            dist/DeckRemote-*-win-x64-setup.exe
            dist/DeckRemote-*-steamos-x64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deck-remote-installers
          path: release-assets

      - name: Verify installation packages
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/DeckRemote-$version-win-x64-setup.exe" \
            "release-assets/DeckRemote-$version-steamos-x64.tar.gz" \
            release-assets/SHA256SUMS.txt \
            --verify-tag --title "Deck Remote $GITHUB_REF_NAME" \
            --notes-file packaging/ReleaseNotes.md
